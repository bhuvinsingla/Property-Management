<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3d26;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>
  
  <!-- House/Building -->
  <path d="M 30 60 L 30 40 L 50 25 L 70 40 L 70 60 Z" fill="#ffffff" stroke="#d4af37" stroke-width="2.5"/>
  
  <!-- Door -->
  <rect x="42" y="50" width="16" height="20" fill="#d4af37" rx="2"/>
  <circle cx="50" cy="60" r="2" fill="#1a5f3f"/>
  
  <!-- Windows -->
  <rect x="35" y="42" width="8" height="8" fill="#d4af37" rx="1"/>
  <rect x="57" y="42" width="8" height="8" fill="#d4af37" rx="1"/>
  
  <!-- Window cross lines -->
  <line x1="39" y1="42" x2="39" y2="50" stroke="#1a5f3f" stroke-width="1"/>
  <line x1="35" y1="46" x2="43" y2="46" stroke="#1a5f3f" stroke-width="1"/>
  <line x1="61" y1="42" x2="61" y2="50" stroke="#1a5f3f" stroke-width="1"/>
  <line x1="57" y1="46" x2="65" y2="46" stroke="#1a5f3f" stroke-width="1"/>
  
  <!-- Roof accent -->
  <path d="M 30 40 L 50 25 L 70 40" fill="none" stroke="#d4af37" stroke-width="3.5" stroke-linecap="round"/>
</svg>

